name: Import WordPress content
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wordpress-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Import public pages and local media
        run: python scripts/import_wordpress.py
      - name: Commit imported content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content wp-content
          if ! git diff --cached --quiet; then
            git commit -m "Import WordPress pages and downloadable media"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
